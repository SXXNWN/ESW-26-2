[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "santas-delivery"
version = "1.0.0"
description = "A 240x240 pixel-art side-scrolling Christmas delivery game"
requires-python = ">=3.11"
dependencies = ["Pillow>=10.0"]

[project.optional-dependencies]
test = ["pytest>=8.0"]
rpi = ["spidev", "lgpio", "numpy"]

[tool.setuptools.packages.find]
include = ["santas_delivery*", "week1_delivery*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
